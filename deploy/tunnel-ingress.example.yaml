# Túnel de casa `contable-casa` (Cloudflare). Corre amb `--token`, així que les rutes es
# gestionen al panell: Zero Trust → Networks → Tunnels → contable-casa → Public Hostname.
#
# Fase 1 (feta el 2026-11-05):
#   Subdomain: pasapas     Domain: nereidlabs.net     Path: (buit)
#   Service:   HTTP        URL:    localhost:3011
#
# Fase 2 (API a :8900): afegir una SEGONA regla amb el mateix hostname i path, i deixar-la ABANS
# de la genèrica (les regles s'avaluen en ordre; es poden arrossegar al panell):
#   Subdomain: pasapas     Domain: nereidlabs.net     Path: api
#   Service:   HTTP        URL:    localhost:8900
# (Al panell el path és un prefix sense barra inicial: `api` enruta /api i /api/*.)
#
# Sense Cloudflare Access: el login és propi (codi per correu, patró PPER, ACUERDO D2).
#
# Equivalent si algun dia el túnel passa a config.yml local (ordre: aquestes abans de http_status:404):
#   - hostname: pasapas.nereidlabs.net
#     path: ^/api(/.*)?$
#     service: http://localhost:8900
#   - hostname: pasapas.nereidlabs.net
#     service: http://localhost:3011
